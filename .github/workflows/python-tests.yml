name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov crcmod boto3 h5py scanpy requests requests-mock anndata numpy pandas
        pip install pysam scipy pybigwig matplotlib
        
    - name: Install samtools
      run: |
        sudo apt-get update
        sudo apt-get install -y samtools
    
    - name: Install package in development mode
      run: |
        pip install -e .
    
    - name: Run tests
      run: |
        python -m pytest src/tests/ --cov=src --cov-report=xml --ignore=cdk/ -v
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        name: Python 3.11

    - name: Run tests with coverage
      run: |
        coverage run --source=src -m pytest src/tests/ --ignore=cdk/ -v
        coverage report -m
        coverage xml

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}