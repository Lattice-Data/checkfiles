services:
  checkfiles:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../src:/app/src
      - ../test_data:/app/test_data
      - ../logs:/app/logs:rw
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - PYTHONUNBUFFERED=1
    command: ["-f", "fastq", "-s3", "s3://submissions-czi114liv/macparland_2024/HCA_Ped_data/C115/C115_bamtofastq_S1_L007_I1_004.fastq.gz", "-d"]

  awstest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
    command: ["aws", "sts", "get-caller-identity"]
    entrypoint: ["aws"]
