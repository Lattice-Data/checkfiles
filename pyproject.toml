[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkfiles"
version = "0.1.0"
description = "File validation utility for FASTQ and other formats"
requires-python = ">=3.8"
dependencies = [
    "h5py>=3.8.0",
    "numpy>=1.19.0",
    "scanpy>=1.9.0",
    "anndata>=0.7.8",
    "requests>=2.31.0",
    "boto3>=1.28.17",
    "botocore>=1.31.17",
    "tqdm>=4.60.0",
    "python-magic>=0.4.24",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "crcmod>=1.7",
    "pandas>=2.0.0",
]

[project.scripts]
checkfiles = "src.checkfiles:main"

[project.optional-dependencies]
test = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "coverage>=7.0.0",
    "requests-mock>=1.11.0",
]
dev = [
    "ruff>=0.3.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.5.1",
]
ami = [
    # Specifically versioned dependencies for AMI builds
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "black==23.7.0",
    "ruff==0.0.282",
    "mypy==1.5.1",
    "types-requests==2.31.0",
    "types-boto3==1.0.2",
    "numpy==1.24.3",
    "h5py==3.10.0",
]