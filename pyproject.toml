[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkfiles"
version = "0.1.0"
description = "File validation utility"
requires-python = ">=3.8"
dependencies = [
    "crcmod>=1.7",
    "requests>=2.31.0",
    "boto3>=1.34.0",
    "pandas>=2.0.0",
    "scanpy>=1.9.0",
    "h5py>=3.8.0"
]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.3.0"
]